[project]
name = "youtube-metadata-collector"
version = "0.1.0"
description = "Lambda that fetches YouTube video metadata for queued jobs and stores it in DynamoDB"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "boto3>=1.43.103",
    "moto[dynamodb,ssm]>=5.2.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
